<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANTUN SUKA SUKA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(45deg, #ff6b9d, #c06c84, #f67280, #355c7d);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            width: 600px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .heart {
            color: #ff1744;
            font-size: 4rem;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.2); }
            50% { transform: scale(1); }
        }

        h1 {
            color: #ff1744;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .pantun-box {
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
            padding: 1.5rem;
            border-radius: 20px;
            margin: 1rem 0;
            border: 3px dashed #ff6b9d;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .pantun-box p {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #2d3436;
            font-weight: bold;
            margin: 0.3rem 0;
        }

        .sampiran {
            color: #6c5ce7;
        }

        .isi {
            color: #d63031;
        }

        .footer {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: #ff1744;
            font-weight: bold;
        }

        .sparkle {
            position: absolute;
            font-size: 1.5rem;
            animation: sparkle 2s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .sparkle1 { top: 10%; left: 10%; animation-delay: 0s; }
        .sparkle2 { top: 15%; right: 15%; animation-delay: 0.5s; }
        .sparkle3 { bottom: 20%; left: 15%; animation-delay: 1s; }
        .sparkle4 { bottom: 15%; right: 10%; animation-delay: 1.5s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sparkle sparkle1">✨</div>
        <div class="sparkle sparkle2">💕</div>
        <div class="sparkle sparkle3">💖</div>
        <div class="sparkle sparkle4">✨</div>
        
        <div class="heart">💝</div>
        <h1>Buat Kamu Adila~</h1>
        
        <div class="pantun-box">
            <p class="sampiran">Naik perahu ke pulau seribu 🚤</p>
            <p class="sampiran">Sambil mancing ikan pari 🎣</p>
            <p class="isi">Diantara semua yang ada di dunia 🌍</p>
            <p class="isi">Kamu yang paling berarti 💖</p>
        </div>

        <div class="footer">
            I Love You So Much! 💕💕💕
        </div>
    </div>
</body>
  </html>
